<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090f"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c878"/>
      <stop offset="100%" stop-color="#dba84a"/>
    </linearGradient>
  </defs>
  <!-- Safe zone maskable : tout doit tenir dans le cercle central -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(96 96)">
    <!-- Toit + maison (rentre dans la safe zone 320x320) -->
    <path d="M30 170 L160 60 L290 170 L260 170 L260 290 L60 290 L60 170 Z" fill="url(#gold)"/>
    <rect x="135" y="210" width="50" height="80" fill="#09090f"/>
    <rect x="85" y="195" width="38" height="38" fill="#09090f"/>
    <rect x="197" y="195" width="38" height="38" fill="#09090f"/>
    <text x="160" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="60" font-weight="900" fill="#09090f">%</text>
  </g>
</svg>
